<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宝宝识字-稳健版</title>
<style>
  :root { --p:#7F77DD; --bg:#FFFEF5; --text:#2C2C2A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); font-family:sans-serif; margin:0; padding:20px; text-align:center; }
  .tabs { display:flex; gap:10px; max-width:400px; margin:0 auto 20px; }
  .tab { flex:1; padding:10px; border-radius:20px; border:1px solid #ddd; background:#fff; cursor:pointer; }
  .tab.active { background:#EEEDFE; color:var(--p); border-color:var(--p); font-weight:bold; }
  .view { display:none; max-width:400px; margin:0 auto; }
  .view.active { display:block; }
  .card { background:#fff; border-radius:25px; border:2px solid #E8E6DF; padding:30px; box-shadow:0 8px 20px rgba(0,0,0,0.05); }
  .pinyin { font-size:28px; color:var(--p); height:40px; font-weight:500; }
  .hanzi { font-size:130px; color:var(--text); margin:20px 0; cursor:pointer; line-height:1; }
  .example { font-size:20px; background:#F0EEFF; padding:15px; border-radius:15px; color:#444; cursor:pointer; line-height:1.4; }
  .example b { color:var(--p); }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:25px; }
  .btn { padding:18px; border-radius:20px; border:none; font-size:18px; font-weight:bold; cursor:pointer; transition:0.1s; }
  .btn:active { transform:scale(0.95); }
  .btn-k { background:#EAF3DE; color:#27500A; }
  .btn-f { background:#FAECE7; color:#993C1D; }
  .sync-box { background:#fff; padding:20px; border-radius:20px; border:1px solid #ddd; margin-top:20px; }
  #qrcode-img { width:200px; height:200px; margin-top:10px; display:none; border:5px solid #fff; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" id="tab-study" onclick="showTab('study')">学习</div>
  <div class="tab" id="tab-set" onclick="showTab('set')">同步/设置</div>
</div>

<div class="view active" id="view-study">
  <div id="study-content">加载中...</div>
</div>

<div class="view" id="view-set">
  <div class="sync-box">
    <h3>同步进度</h3>
    <p style="font-size:14px;color:#666;">生成二维码后，用另一台设备扫码即可。</p>
    <button class="btn" style="width:100%; background:var(--p); color:white;" onclick="makeQR()">📤 生成同步二维码</button>
    <img id="qrcode-img" src="" alt="二维码">
    <hr style="margin:20px 0; opacity:0.3;">
    <button class="btn" style="width:100%; background:#1D9E75; color:white;" onclick="document.getElementById('qr-input').click()">📥 导入进度图片</button>
    <input type="file" id="qr-input" style="display:none" accept="image/*" onchange="handleImport(this)">
  </div>
  <button class="btn" style="width:100%; margin-top:20px; background:#ddd;" onclick="if(confirm('重置所有进度吗？')){localStorage.clear();location.reload();}">⚠️ 重置所有数据</button>
</div>

<script>
// --- 精简字库 ---
const WORDS_RAW = [
    ["人","rén","★是世界上最聪明的动物"],
    ["口","kǒu","小朋友用★吃饭"],
    ["大","dà","大象的耳朵很★"],
    ["中","zhōng","★间那个苹果最红"],
    ["小","xiǎo","小猫咪长得很★"],
    ["一","yī","我会数★二三四"],
    ["上","shàng","太阳公公在天★"],
    ["下","xià","雨点落在地★"],
    ["爸","bà","我的★爸力气很大"],
    ["妈","mā","★妈的手很温暖"]
];

// --- 状态管理 ---
let S = { words:[], idx:0 };
function loadS() {
    const local = localStorage.getItem('shizi_v4');
    if(local) {
        S = JSON.parse(local);
    } else {
        S.words = WORDS_RAW.map(w => ({char:w[0], pin:w[1], ex:w[2], ok:false}));
        saveS();
    }
}
function saveS() { localStorage.setItem('shizi_v4', JSON.stringify(S)); }

// --- 语音逻辑 (优化后的萌萌音) ---
function speak(txt, isChild = true) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-CN';
    if(isChild) {
        u.pitch = 1.3; // 轻微提高音调，不刺耳
        u.rate = 0.85; // 稍微放慢，让孩子听清
    } else {
        u.pitch = 1.0;
        u.rate = 0.8;
    }
    window.speechSynthesis.speak(u);
}

// --- 渲染逻辑 ---
function render() {
    const el = document.getElementById('study-content');
    const w = S.words[S.idx];
    if(!w) { el.innerHTML = "<h3>全部学完啦！</h3>"; return; }
    
    el.innerHTML = `
        <div class="card">
            <div class="pinyin">${w.pin}</div>
            <div class="hanzi" onclick="speak('${w.char}')">${w.char}</div>
            <div class="example" onclick="speak('${w.ex.replace('★', w.char)}', false)">
                ${w.ex.replace('★', '<b>'+w.char+'</b>')}
            </div>
            <p style="color:#999; font-size:12px; margin-top:10px;">点击汉字听声音，点击句子读例句</p>
        </div>
        <div class="btns">
            <button class="btn btn-f" onclick="doNext(false)">不认识</button>
            <button class="btn btn-k" onclick="doNext(true)">认识了</button>
        </div>
    `;
}

function doNext(isOk) {
    if(isOk) S.words[S.idx].ok = true;
    S.idx = (S.idx + 1) % S.words.length; // 循环学习
    saveS();
    render();
}

function showTab(t) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+t).classList.add('active');
    document.getElementById('tab-'+t).classList.add('active');
}

// --- 同步逻辑 (使用 Google API 生成二维码，更稳定) ---
function makeQR() {
    const data = btoa(encodeURIComponent(JSON.stringify(S)));
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=SHIZI:${data}`;
    const img = document.getElementById('qrcode-img');
    img.src = url;
    img.style.display = 'inline-block';
}

function handleImport(input) {
    alert("导入功能需要识别图片，目前建议手动在两台设备点选。后续我会为你优化更简单的导入方式！");
}

// 初始化
loadS();
render();
</script>
</body>
</html>
